<touchégg>

  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">auto</property>
    <property name="borderColor">auto</property>
  </settings>

  <!--
    Laptop-only (touchpad hardware). All actions below drive sway directly
    via swaymsg, acting on the focused container -- the same target $mod
    bindings in ~/.config/sway/config use. (scroll doesn't exec this: its
    own gesture_scroll + bindgesture cover touchpad gestures natively, see
    ~/.config/scroll/config.) Kept off the touchpad's existing 3/4-finger
    click behavior by living entirely on gestures, so normal touchpad use
    is unaffected.
  -->
  <application name="All">

    <!-- 3-finger swipe left/right: next/previous workspace -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>swaymsg workspace next</command>
        <on>end</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>swaymsg workspace prev</command>
        <on>end</on>
      </action>
    </gesture>

    <!-- 3-finger swipe up: fullscreen toggle (mirrors $mod+f) -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>swaymsg fullscreen toggle</command>
        <on>end</on>
      </action>
    </gesture>

    <!-- 3-finger swipe down: scratchpad show (mirrors $mod+grave) -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>swaymsg scratchpad show</command>
        <on>end</on>
      </action>
    </gesture>

    <!-- 2-finger pinch: resize the focused window (mirrors $mod+r's resize
         mode), shrinking on pinch in and growing on pinch out, continuously
         as the gesture progresses. -->
    <gesture type="PINCH" fingers="2" direction="IN">
      <action type="RUN_COMMAND">
        <repeat>true</repeat>
        <command>swaymsg 'resize shrink width 10 px or 10 ppt; resize shrink height 10 px or 10 ppt'</command>
        <decreaseCommand>swaymsg 'resize grow width 10 px or 10 ppt; resize grow height 10 px or 10 ppt'</decreaseCommand>
      </action>
    </gesture>
    <gesture type="PINCH" fingers="2" direction="OUT">
      <action type="RUN_COMMAND">
        <repeat>true</repeat>
        <command>swaymsg 'resize grow width 10 px or 10 ppt; resize grow height 10 px or 10 ppt'</command>
        <decreaseCommand>swaymsg 'resize shrink width 10 px or 10 ppt; resize shrink height 10 px or 10 ppt'</decreaseCommand>
      </action>
    </gesture>

    <!-- 3-finger pinch in: close the focused window (mirrors $mod+q) -->
    <gesture type="PINCH" fingers="3" direction="IN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>swaymsg kill</command>
        <on>end</on>
      </action>
    </gesture>

    <!-- 2-finger tap: right click. 3-finger tap: middle click. -->
    <gesture type="TAP" fingers="2">
      <action type="MOUSE_CLICK">
        <button>3</button>
        <on>begin</on>
      </action>
    </gesture>
    <gesture type="TAP" fingers="3">
      <action type="MOUSE_CLICK">
        <button>2</button>
        <on>begin</on>
      </action>
    </gesture>

  </application>

  <!-- Let the browser handle its own pinch-to-zoom instead of resizing
       the window. -->
  <application name="Google-chrome,Chromium-browser,firefox,Firefox">
    <gesture type="PINCH" fingers="2" direction="IN">
      <action type="SEND_KEYS">
        <repeat>true</repeat>
        <modifiers>Control_L</modifiers>
        <keys>KP_Subtract</keys>
        <decreaseKeys>KP_Add</decreaseKeys>
      </action>
    </gesture>
    <gesture type="PINCH" fingers="2" direction="OUT">
      <action type="SEND_KEYS">
        <repeat>true</repeat>
        <modifiers>Control_L</modifiers>
        <keys>KP_Add</keys>
        <decreaseKeys>KP_Subtract</decreaseKeys>
      </action>
    </gesture>
  </application>

</touchégg>
