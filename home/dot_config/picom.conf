backend = "glx";
vsync = true;

# Transparency (needed for Alacritty's window.opacity to actually render)
active-opacity = 1.0;
inactive-opacity = 1.0;

# Blur behind transparent windows (disabled — kept here for reference)
# blur: {
#   method = "dual_kawase";
#   strength = 5;
# }
# blur-background = true;
# blur-background-exclude = [
#   "window_type = 'dock'",
#   "window_type = 'desktop'",
# ];

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
];

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
