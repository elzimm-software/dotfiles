[Seat:*]
# Run the same xrandr monitor layout used by i3 before the greeter is shown,
# as root, so the login prompt lands on the correct monitor at the correct
# position/rate instead of whatever the X server's default clone/extend
# layout happens to be.
#
# This has to live under /usr/local/bin rather than ~/.config/i3: lightdm's
# display-setup-script runs in the confined xdm_t SELinux domain, which is
# denied execute on anything labeled config_home_t (i.e. everything under
# ~/.config). /usr/local/bin gets bin_t by default, which xdm_t can exec.
display-setup-script=/usr/local/bin/i3-monitors.sh
