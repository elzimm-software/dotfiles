[Seat:*]
# Run the desktop's 3-monitor xrandr layout before the greeter is shown, as
# root, so the login prompt lands on the correct monitor at the correct
# position/rate instead of whatever the X server's default clone/extend
# layout happens to be. The greeter (lightdm-gtk-greeter) is X11 regardless
# of which Wayland compositor the user session picks afterward, so this is
# needed independent of WM choice -- desktop-only, see system/sync.sh.
#
# This has to live under /usr/local/bin rather than ~/.config: lightdm's
# display-setup-script runs in the confined xdm_t SELinux domain, which is
# denied execute on anything labeled config_home_t (i.e. everything under
# ~/.config). /usr/local/bin gets bin_t by default, which xdm_t can exec.
display-setup-script=/usr/local/bin/desktop-monitors.sh
