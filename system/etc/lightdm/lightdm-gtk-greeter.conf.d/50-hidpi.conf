# HiDPI laptop overrides, layered onto ../lightdm-gtk-greeter.conf via that
# greeter's own conf.d support (see src/greeterconfiguration.c: it merges
# <XDG_CONFIG_DIRS>/lightdm/lightdm-gtk-greeter.conf.d/*.conf, and
# /etc/lightdm/lightdm-gtk-greeter.conf.d/*.conf specifically, alphabetically,
# over the base file). Laptop-only: do not push this file (or the background
# image it points to) from the desktop machine.
[greeter]
background=/usr/share/backgrounds/horizon-dark-greeter-laptop.jpg
background-color=#1e181a
font-name=Hack Nerd Font Mono 9
xft-dpi=163
user-background=false
